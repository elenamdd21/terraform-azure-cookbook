name: Terraform CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/**'
      - '.checkov.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/**'
      - '.checkov.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Format and validate examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        shell: bash
        run: terraform fmt -check -recursive

      - name: Validate every example
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t examples < <(find examples -mindepth 2 -maxdepth 2 -name main.tf -printf '%h\n' | sort)
          if [ "${#examples[@]}" -eq 0 ]; then
            echo "No examples/*/main.tf files found."
            exit 1
          fi
          for example in "${examples[@]}"; do
            echo "::group::Validate ${example}"
            terraform -chdir="${example}" init -backend=false -input=false
            terraform -chdir="${example}" validate
            echo "::endgroup::"
          done

  security-scan:
    name: Checkov Terraform scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          quiet: true
