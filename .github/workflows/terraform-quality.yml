name: Terraform Quality and Security

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-format:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check formatting
        run: terraform fmt -check -recursive

  validate-examples:
    name: Validate examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Validate every example
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t example_dirs < <(find examples -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#example_dirs[@]}" -eq 0 ]; then
            echo "No example directories found under examples/" >&2
            exit 1
          fi
          for dir in "${example_dirs[@]}"; do
            if [ -f "$dir/main.tf" ]; then
              echo "==> Validating $dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
            fi
          done

  checkov:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli
